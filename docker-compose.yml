services:
  nginx:
    image: nginx:1.27-alpine
    container_name: home-lab-reverse-proxy
    restart: unless-stopped
    ports:
      # Bind to the server's private network interfaces, never a public
      # interface. Restrict access to LAN and Tailscale clients in the firewall.
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:443:8000"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  proxy:
    name: home-lab-proxy
